<div class="p-4 text-sm">


    <details class="group" open>
        <summary
            class="flex items-center justify-between cursor-pointer list-none font-bold text-[#013B5C] hover:bg-blue-50 p-2 rounded-lg transition-colors duration-300">
            <div class="flex items-center gap-2 select-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#013B5C]" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
                <span class="select-none">FASE MINADO</span>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4 transition-transform duration-300 group-open:rotate-180" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" />
            </svg>
        </summary>

        <div class="overflow-hidden transform">
            <ul class="ml-4 mt-0.5 space-y-2 border-l-2 border-blue-200 pl-4 py-1 select-none">
                @for (item of listaFases(); track $index) {
                <li [routerLink]="item.path" routerLinkActive="tab-active" (click)="onFaseClick(item.cod_fase!)"
                    class="flex items-center gap-2 text-gray-600 hover:text-[#013B5C] cursor-pointer transition-colors font-medium p-0.5 rounded ">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" stroke-width="2"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path [attr.d]="iconos[item.icono]" />
                    </svg>
                    {{ item.title }}
                </li>
                }
            </ul>
        </div>
    </details>

    <details class="group mt-3">
        <summary
            class="flex items-center justify-between cursor-pointer list-none text-[#013B5C] hover:bg-blue-50 p-2 rounded-lg transition-colors duration-300">
            <div class="flex items-center gap-2 select-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#013B5C]" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="select-none"><b>INVERSION</b></span>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg"
                class="w-4 h-4 transition-transform duration-300 group-open:rotate-180" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" />
            </svg>
        </summary>
        <div class="overflow-hidden transition-all duration-500 max-h-0 group-open:max-h-40">
            <div class="p-4 text-gray-500 italic">
                Contenido de inversión...
            </div>
        </div>
    </details>

</div>
