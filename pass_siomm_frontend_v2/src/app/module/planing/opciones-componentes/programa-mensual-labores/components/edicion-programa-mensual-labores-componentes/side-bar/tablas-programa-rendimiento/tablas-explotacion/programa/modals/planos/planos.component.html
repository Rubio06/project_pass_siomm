<div class="modal modal-open modal">
    <div class="modal-box max-w-6xl shadow-2xl bg-gradient-to-br from-slate-70 to-slate-100">

        <!-- Header -->
        <div class="main-container">
            <div class="content-wrapper">

                <div class="viewer-section">
                    <div class="canvas-placeholder flex items-center justify-center h-full">

                        @if (pdfSeleccionado) {
                        <iframe [src]="pdfSeleccionado" width="100%" height="100%" style="border:none">
                        </iframe>
                        } @else {

                        <div class="flex flex-col items-center justify-center text-[#013B5C] opacity-70">

                            <!-- Icono PDF -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 mb-3 text-[#013B5C]/60" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">

                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M19.5 14.25v-7.5a2.25 2.25 0 0 0-2.25-2.25H8.25L4.5 8.25v9A2.25 2.25 0 0 0 6.75 19.5h4.5" />

                                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5v3.75H4.5" />

                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15.75 18h3m0 0-1.5-1.5m1.5 1.5-1.5 1.5" />

                            </svg>

                            <p class="text-sm font-medium">
                                No hay un archivo PDF cargado
                            </p>

                            <span class="text-xs text-gray-500 mt-1">
                                Selecciona un plano de la lista para visualizarlo
                            </span>

                        </div>

                        }

                    </div>

                    <!-- <div class="footer-instruction text-[#013B5C]">
                        Para Imprimir o Visualizar en PDF dar DOBLECLICK! Sobre la Imagen
                    </div> -->
                </div>

                <aside class="sidebar">
                    <div class="action-buttons">
                        <input type="file" accept=".pdf" (change)="subirArchivo($event)" hidden #fileInput />
                        <button type="button" class="btn-inst" (click)="fileInput.click()">Ins</button>
                        <button type="button" class="btn-del" (click)="eliminarPlano()">Del</button>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th><b>Plano</b></th>
                                    <th><b>Nro.</b></th>
                                </tr>
                            </thead>
                            <tbody>
                                @for (plano of listMostrarPlanos(); track $index) {
                                <tr (dblclick)="selecionarLista(plano)"
                                    [ngClass]="{'bg-[#17324D]/10 border-l-2: ' : filaSelecionada() === plano.secuencia }">
                                    <td>{{ plano.descripcion }}</td>
                                    <td>{{ plano.secuencia }}</td>
                                </tr>
                                }
                            </tbody>
                        </table>
                    </div>

                    <div class="spacer"></div>

                    <button type="button" class="btn-cerrar" (click)="closeModalPlano()">Cerrar</button>
                </aside>

            </div>
        </div>
    </div>
</div>
