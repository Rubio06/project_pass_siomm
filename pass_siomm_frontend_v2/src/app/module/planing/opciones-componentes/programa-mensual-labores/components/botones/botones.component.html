<button type="button" (click)="accion.emit()"
    class="flex items-center space-x-2 px-4 py-2 text-white bg-[green] rounded-md font-semibold text-sm shadow-md hover:bg-[#green] transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
    [ngClass]="{
        'bg-[green] hover:bg-green-650': variant() === 'success',
        'bg-[#012D96] hover:bg-[#012D96]-700': variant() === 'primary',
        'bg-[#002B48] hover:bg-[#002B48]-700': variant() === 'danger'
    }"
    >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
    <span>{{ texto() }}</span>
</button>
