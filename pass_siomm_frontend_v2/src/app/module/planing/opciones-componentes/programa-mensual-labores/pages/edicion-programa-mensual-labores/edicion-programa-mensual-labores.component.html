<div class="container mx-auto">
    <div class="flex flex-col md:flex-row  lg:flex-row xl:flex-row mt-6 lg:mt-4 gap-6">

        <!-- Sidebar -->
        <div
            class="w-full md:w-[35%]  lg:w-[40%] xl:w-[26%] 2xl:w-[20%] shadow-lg border border-gray-200 rounded-xl bg-white overflow-hidden font-sans">
            <app-slider-programa-mensual (codFaseSelected)="onFaseClick($event)" />
        </div>

        <!-- Contenido principal -->
        <div class="w-full md:w-[65%] lg:w-[60%] xl:w-[74%] 2xl:w-[78%]">
            <form class="w-full">

                <div class="p-5 rounded-xl border border-gray-200 shadow-sm mb-3 w-full">
                    <app-titulo-modulo [titulo]="'Información Programa Mensual de Labores'" />

                    <app-formulario-programa-mensual  />
                </div>

                <div class="rounded-xl ml-3 mr-3">
                    <h3 class="text-lg font-bold mb-5 pb-2 border-b border-gray-300
                                flex items-center gap-2 text-[#013B5C]">

                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                            stroke="currentColor" class="w-6 h-6 text-[#013B5C]">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 3c2.757 0 5.23 1.107 7.071 2.949A10.437 10.437 0 0 1 21 12c0 2.757-1.107 5.23-2.949 7.071A10.437 10.437 0 0 1 12 21c-2.757 0-5.23-1.107-7.071-2.949A10.437 10.437 0 0 1 3 12c0-2.757 1.107-5.23 2.949-7.071A10.437 10.437 0 0 1 12 3Z" />
                        </svg>
                        Acciones – Programa Mensual
                    </h3>


                    <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                        <div class="flex flex-wrap items-center gap-4">
                            @for (btn of botones(); track $index) {
                            <app-botones [texto]="btn.texto" (accion)="onAccion(btn.accion)" [color]="btn.color"
                                [icono]="btn.icono" [bloqueo]="btn.bloqueo ?? false" />
                            }
                        </div>

                        <div class="inline-flex items-center gap-3 px-4 py-2 rounded-xl
                        bg-gray-50
                        transition-all duration-200">

                            <!-- Indicador con check -->
                            <span class="flex items-center justify-center w-7 h-7 rounded-full
                            text-white text-xs animate-pulse" [ngClass]="botoColor()">

                                <!-- Check SVG -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                </svg>

                            </span>

                            <!-- Texto -->
                            <span class="text-sm font-bold">
                                {{ botoPresionado() }}
                            </span>
                        </div>
                    </div>

                </div>

                <hr class="border-gray-200 my-4">

                <div class="w-full overflow-x-auto">
                    <router-outlet />
                </div>
            </form>
        </div>

    </div>
</div>
