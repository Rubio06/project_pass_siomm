<div class="modal modal-open w-full">
    <div class="modal-box w-11/12 max-w-4xl bg-base-100 p-5 rounded-xl shadow-xl border border-base-200">

        <div class="flex justify-between items-center pb-3">
            <h3 class="text-xl font-bold text-[#013B5C] flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Edición Balanza
            </h3>
            <!-- (click)="onCerrarConConfirmacion()" -->
            <button type="button" class="btn btn-sm btn-circle btn-ghost" (click)="onCerrar.emit(false)">✕</button>
        </div>

        <form class="flex flex-col" [formGroup]="miFormulario" (ngSubmit)="onGuardar()">

            <fieldset class="border border-gray-300 rounded p-4 mb-3">
                <legend class="px-2 text-sm font-semibold text-base-content/70">
                    Datos Balanza
                </legend>

                <div class="flex flex-col sm:flex-row gap-2 mb-3">
                    <div class="form-control w-full flex flex-1 gap-2">
                        <label class="label py-0.5">
                            <span class="label-text font-semibold text-xs text-base-content/70">Fecha: </span>
                        </label>
                        <div class="flex flex-col w-full">
                            <input type="date" formControlName="fec_emision" class="input-base_date" />
                            <!-- @if(formsUtils.isValidField(miFormulario,'c_t_representante')) {
                            <div class="text-[#C23E32] text-xs mt-1">
                                <span><b>{{ formsUtils.getFiledError(miFormulario,'c_t_representante') }}</b></span>
                            </div>
                            } -->

                        </div>


                    </div>

                    <div class="form-control w-full flex-1 flex gap-2">
                        <label class="label py-0.5">
                            <span class="label-text font-semibold text-xs text-base-content/70">Turno: </span>
                        </label>

                        <div class="flex flex-col w-full">
                            <select class="select-base_cuatro" formControlName="cod_turno">
                                @for (item of listTurnosActivos(); track item.cod_turno) {
                                    <option [value]="item.cod_turno"> {{ item.des_turno }} </option>
                                }

                            </select>

                            <!-- @if(formsUtils.isValidField(miFormulario,'cod_contrata')) {
                                <div class="text-[#C23E32] text-xs mt-1">
                                    <span><b>{{ formsUtils.getFiledError(miFormulario,'cod_contrata') }}</b></span>
                                </div>
                                } -->
                        </div>
                    </div>

                    <div class="form-control w-full flex-1 flex gap-2">
                        <label class="label py-0.5">
                            <span class="label-text font-semibold text-xs text-base-content/70">Estado: </span>
                        </label>
                        <div class="flex flex-col w-full">
                            <label class="input-base_5">
                                {{ miFormulario.get('est_ticket_balanza')?.value | estadoTicketBalanza }}
                            </label>
                        </div>

                    </div>

                </div>

                <div class="flex flex-col sm:flex-col xl:flex-row gap-2">

                    <div class="flex flex-row sm:flex-row gap-2">
                        <div class="form-control flex gap-2 flex-1">
                            <label class="label py-0.5">
                                <span class="label-text font-semibold text-xs text-base-content/70">Nro. Ticket</span>
                            </label>
                            <div class="flex flex-col w-full">
                                <input type="text" formControlName="cod_ticket_balanza" class="input-base_5" />
                                <!-- @if(formsUtils.isValidField(miFormulario,'c_t_representante')) {
                                <div class="text-[#C23E32] text-xs mt-1">
                                    <span><b>{{ formsUtils.getFiledError(miFormulario,'c_t_representante') }}</b></span>
                                </div>
                                } -->

                            </div>

                        </div>


                        <div class="form-control flex gap-2 flex-1">
                            <label class="label py-0.5 ">
                                <span class="label-text font-semibold text-xs text-base-content/70">Guia
                                    Remitente</span>
                            </label>
                            <div class="flex flex-col w-full">
                                <input type="text" formControlName="des_guia_remitente" class="input-base_5" />
                                <!-- @if(formsUtils.isValidField(miFormulario,'c_t_representante')) {
                                <div class="text-[#C23E32] text-xs mt-1">
                                    <span><b>{{ formsUtils.getFiledError(miFormulario,'c_t_representante') }}</b></span>
                                </div>
                                } -->

                            </div>

                        </div>

                    </div>
                    <div class="form-control flex gap-2 flex-2">
                        <label class="label py-0.5">
                            <span class="label-text font-semibold text-xs text-base-content/70">Material</span>
                        </label>
                        <div class="flex flex-col flex-1">
                            <select class="select-base_cuatro w-full" formControlName="cod_tipo_material">
                                <option value="M">Mineral</option>
                                <option value="D">Otros</option>

                            </select>


                        </div>

                        <div class="flex-1">
                            <select class="select-base_cuatro w-full" formControlName="cod_tipo_material_detalle">
                                <option>Ejemplo1 </option>

                            </select>
                        </div>

                    </div>

                </div>
            </fieldset>

            <fieldset class="border border-gray-300 rounded p-4">
                <legend class="px-2 text-sm font-semibold text-base-content/70">
                    Caracteristicas del Transporte
                </legend>

                <div class="flex flex-col sm:flex-row gap-4 mb-3">
                    <div class="form-control w-full flex flex-1 gap-2">
                        <label class="label py-0.5">
                            <span class="label-text font-semibold text-xs text-base-content/70">Contratista: </span>
                        </label>
                        <div class="flex flex-col w-full">
                            <select class="select-base_cuatro" formControlName="cod_proveedor">
                                <option>Ejemplo1 </option>

                            </select>
                        </div>

                    </div>

                    <div class="form-control w-full flex-1 flex gap-2">
                        <label class="label py-0.5">
                            <span class="label-text font-semibold text-xs text-base-content/70">Nro. Contrato: </span>
                        </label>

                        <div class="flex flex-col w-full">
                            <select class="select-base_cuatro" formControlName="cod_contrato">
                                <option>Ejemplo1 </option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="flex flex-col sm:flex-col xl:flex-row gap-2 w-full">

                    <div class="flex flex-col sm:flex-row gap-2 flex-1 items-end">

                        <div class="flex flex-col sm:flex-col xl:flex-row w-full gap-2 items-end flex-2">
                            <div class="form-control flex gap-2 flex-2 w-full ">
                                <label class="label py-0.5">
                                    <span class="label-text font-semibold text-xs text-base-content/70">Chofer: </span>
                                </label>
                                <select class="select-base_cuatro" formControlName="cod_personal">
                                    <option>Ejemplo1 </option>
                                </select>
                                <button>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M15 3h6v6" />
                                        <path d="M10 14L21 3" />
                                        <path d="M21 14v7h-7" />
                                        <path d="M3 10V3h7" />
                                    </svg>
                                </button>
                            </div>


                            <div class="form-control flex flex-1 flex-col w-full">
                                <label class="label py-0.5 ">
                                    <span class="label-text font-semibold text-xs text-base-content/70">Tipo Transporte:
                                    </span>
                                </label>
                                <select class="select-base_cuatro" formControlName="cod_tipo_car">
                                    <option>Ejemplo1 </option>

                                </select>

                            </div>

                        </div>
                        <div class="flex flex-col sm:flex-col xl:flex-row w-full gap-2 flex-1">
                            <div class="form-control flex-2 flex items-end  w-full gap-2">

                                <div class="flex flex-col w-full">
                                    <label class="label py-0.5 ">
                                        <span class="label-text font-semibold text-xs text-base-content/70">
                                            Código Vehiculo:
                                        </span>
                                    </label>
                                    <select class="select-base_cuatro" formControlName="cod_tipo_car_equipo">
                                        <option>Ejemplo1 </option>

                                    </select>

                                </div>
                                <div>
                                    <button>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M15 3h6v6" />
                                            <path d="M10 14L21 3" />
                                            <path d="M21 14v7h-7" />
                                            <path d="M3 10V3h7" />
                                        </svg>
                                    </button>

                                </div>

                            </div>

                            <div class="form-control flex-1 flex flex-col w-full">

                                <label class="label py-0.5 ">
                                    <span class="label-text font-semibold text-xs text-base-content/70">
                                        Placa:
                                    </span>
                                </label>
                                <div class="w-full">
                                    <input type="text" formControlName="cod_placa" class="input-base_5" />
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="flex mt-3 gap-4">

                    <div class="w-full flex-1 flex flex-row gap-2">
                        <label class="label py-0.5 ">
                            <span class="label-text font-semibold text-xs text-base-content/70">
                                Scoop:
                            </span>
                        </label>
                        <select class="select-base_cuatro" formControlName="cod_maquinaria">
                            <option>Ejemplo1 </option>

                        </select>

                    </div>
                    <div class="form-control w-full flex gap-2 flex-1">
                        <div class="flex flex-col w-full">
                            <input type="text" formControlName="des_maquinaria" class="input-base_5" />
                        </div>
                    </div>

                </div>

                <div class="flex flex-col sm:flex-col xl:flex-row gap-2 w-full mt-3">

                    <div class="flex flex-col sm:flex-row xl:flex-row w-full gap-2 items-end flex-1">
                        <div class="form-control flex gap-2 flex-1 w-full ">
                            <label class="label py-0.5">
                                <span class="label-text font-semibold text-xs text-base-content/70">Tipo Labor: </span>
                            </label>
                            <select class="select-base_cuatro" formControlName="cod_tipo_labor">
                                <option>Ejemplo1 </option>
                            </select>
                        </div>


                        <div class="form-control gap-2 flex flex-1 w-full">
                            <label class="label py-0.5 ">
                                <span class="label-text font-semibold text-xs text-base-content/70">Labor:
                                </span>
                            </label>
                            <select class="select-base_cuatro" formControlName="nom_labor">
                                <option>Ejemplo1 </option>

                            </select>

                        </div>

                    </div>
                    <div class="flex flex-col sm:flex-row xl:flex-row w-full gap-2 flex-1">
                        <div class="form-control flex items-end  w-full gap-2 flex-1">

                            <div class="flex flex-1  gap-2 w-full">
                                <label class="label py-0.5 ">
                                    <span class="label-text font-semibold text-xs text-base-content/70">
                                        Ala:
                                    </span>
                                </label>
                                <select class="select-base_cuatro" formControlName="cod_ala">
                                    <option>Ejemplo1 </option>

                                </select>

                            </div>

                        </div>

                        <div class="form-control gap-2 flex w-full flex-1">

                            <label class="label py-0.5 ">
                                <span class="label-text font-semibold text-xs text-base-content/70">
                                    Nro. Carros:
                                </span>
                            </label>
                            <div class="w-full">
                                <input type="text" formControlName="num_cantidad_carros" class="input-base_5" />
                            </div>

                        </div>

                    </div>

                </div>

                <div class="flex mt-3 gap-4">

                    <div class="w-full flex-1 flex flex-col">
                        <label class="label py-0.5 ">
                            <span class="label-text font-semibold text-xs text-base-content/70">
                                Ruta:
                            </span>
                        </label>
                        <select class="select-base_cuatro" formControlName="cod_item_ruta">
                            <option>Ejemplo1 </option>

                        </select>

                    </div>
                    <div class="form-control w-full flex flex-col flex-1">
                        <label class="label py-0.5 ">
                            <span class="label-text font-semibold text-xs text-base-content/70">
                                Origen:
                            </span>
                        </label>
                        <div class="flex flex-col w-full">
                            <input type="text" formControlName="ruta_origen" class="input-base_5" />
                        </div>
                    </div>

                    <div class="form-control w-full flex flex-col flex-1">
                        <label class="label py-0.5 ">
                            <span class="label-text font-semibold text-xs text-base-content/70">
                                Destino:
                            </span>
                        </label>
                        <div class="flex flex-col w-full">
                            <input type="text" formControlName="ruta_destino" class="input-base_5" />
                        </div>
                    </div>


                </div>

            </fieldset>


            <div class="flex flex-col sm:flex-row w-full gap-5 mt-4">
                <fieldset class="border border-gray-300 rounded p-3 flex flex-col flex-1">

                    <label class="label py-0.5">
                        <span class="label-text font-semibold text-xs text-base-content/70">11/08/2019 TURNO A </span>
                    </label>
                    <label class="label py-0.5">
                        <span class="label-text font-semibold text-xs text-base-content/70">AC01 (ACUNIA VERA EDIXON
                            ABEL) </span>
                    </label>
                    <label class="label py-0.5">
                        <span class="label-text font-semibold text-xs text-base-content/70">PROFUNDIZACION / 4250</span>
                    </label>
                    <label class="label py-0.5">
                        <span class="label-text font-semibold text-xs text-base-content/70">MINA > CHANCADO </span>
                    </label>
                    <label class="label py-0.5">
                        <span class="label-text font-semibold text-xs text-base-content/70">Usuario Generado:
                            balanza.raul </span>
                    </label>
                    <label class="label py-0.5">
                        <span class="label-text font-semibold text-xs text-base-content/70">Usuario: Aprobación </span>
                    </label>
                </fieldset>

                <fieldset class="border border-gray-300 rounded p-3 flex-1 flex flex-col">

                    <div class="flex text-center">
                        <div class="label py-0.5 w-[20%]"></div>
                        <label class="label py-0.5 flex-1 justify-center ">
                            <span class="label-text font-semibold text-xs text-base-content/70">Fecha y Hora: </span>
                        </label>
                        <label class="label py-0.5 flex-1 justify-center ">
                            <span class="label-text font-semibold text-xs text-base-content/70">Peso: </span>
                        </label>
                    </div>


                    <div class="form-control w-full flex flex-1 gap-2 flex-col">
                        <div class="flex gap-4">
                            <label class="label py-0.5 w-[20%]">
                                <span class="label-text font-semibold text-xs text-base-content/70">Perso Bruto: </span>
                            </label>
                            <div class="flex flex-col w-full flex-1">
                                <input type="text" formControlName="fec_peso_entrada" class="input-base_5" />
                                <!-- @if(formsUtils.isValidField(miFormulario,'c_t_representante')) {
                                <div class="text-[#C23E32] text-xs mt-1">
                                    <span><b>{{ formsUtils.getFiledError(miFormulario,'c_t_representante') }}</b></span>
                                </div>
                                } -->

                            </div>

                            <div class="flex flex-col w-full flex-1">
                                <input type="text" formControlName="num_peso_entrada_tmh" class="input-base_5" />
                                <!-- @if(formsUtils.isValidField(miFormulario,'c_t_representante')) {
                                <div class="text-[#C23E32] text-xs mt-1">
                                    <span><b>{{ formsUtils.getFiledError(miFormulario,'c_t_representante') }}</b></span>
                                </div>
                                } -->

                            </div>

                        </div>

                        <div class="flex gap-4">
                            <label class="label py-0.5 w-[20%]">
                                <span class="label-text font-semibold text-xs text-base-content/70">Tara: </span>
                            </label>
                            <div class="flex flex-col w-full flex-1">
                                <input type="text" formControlName="fec_peso_salida" class="input-base_5" />
                                <!-- @if(formsUtils.isValidField(miFormulario,'c_t_representante')) {
                                <div class="text-[#C23E32] text-xs mt-1">
                                    <span><b>{{ formsUtils.getFiledError(miFormulario,'c_t_representante') }}</b></span>
                                </div>
                                } -->

                            </div>

                            <div class="flex flex-col w-full flex-1">
                                <input type="text" formControlName="num_peso_salida_tmh" class="input-base_5" />
                                <!-- @if(formsUtils.isValidField(miFormulario,'c_t_representante')) {
                                <div class="text-[#C23E32] text-xs mt-1">
                                    <span><b>{{ formsUtils.getFiledError(miFormulario,'c_t_representante') }}</b></span>
                                </div>
                                } -->

                            </div>

                        </div>

                        <div class="flex gap-4">
                            <label class="label py-0.5 w-[20%]">
                                <span class="label-text font-semibold text-xs text-base-content/70"> </span>
                            </label>
                            <label class="label py-0.5 w-full flex-1 justify-center">
                                <span class="label-text font-semibold text-xs text-base-content/70">Peso Neto: </span>
                            </label>

                            <div class="flex flex-col w-full flex-1">
                                <input type="text" formControlName="num_peso_neto_tmh" class="input-base_5" />

                            </div>

                        </div>

                        <div class="flex  gap-4">

                            <label class="label py-0.5 w-[20%]">


                            </label>

                            <div class="label py-0.5 flex-1 w-full">
                                <button type="button"
                                    class="w-full btn btn-sm text-white bg-[#013B5C] hover:bg-[#002B48] flex items-center gap-1">

                                    Capturar Peso Bruto
                                </button>

                            </div>

                            <div class="label py-0.5 flex-1 w-full">

                                <button type="button"
                                    class="btn btn-sm text-white bg-[#013B5C] hover:bg-[#002B48]  w-full flex items-center gap-1">

                                    Capturar Tara
                                </button>
                            </div>

                        </div>
                    </div>

                </fieldset>



            </div>
            <fieldset class="border border-gray-300 rounded p-2 mt-3">
                <legend class="px-2 text-sm font-semibold text-base-content/70">
                    Comentarios
                </legend>

                <div class="flex flex-col sm:flex-row gap-2 mb-3">
                    <div class="form-control w-full flex flex-1 gap-2">

                        <div class="flex flex-col w-full">
                            <textarea formControlName="des_comentario" class="input-base_5 resize-none">

                            </textarea>
                        </div>


                    </div>

                </div>

            </fieldset>

            <div class="modal-action border-t border-base-200 pt-3 mt-2 flex justify-end gap-2">
                <button type="submit"
                    class="btn btn-sm text-white bg-[#013B5C] hover:bg-[#002B48] flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    Guardar
                </button>
                <button type="button" class="btn btn-sm btn-outline border-base-300 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>

                                <div class="text-[#C23E32] text-xs mt-1">
                                    <span><b>{{ formsUtils.getFiledError(miFormulario,'cod_contrata') }}</b></span>
                                </div>
                                } -->
