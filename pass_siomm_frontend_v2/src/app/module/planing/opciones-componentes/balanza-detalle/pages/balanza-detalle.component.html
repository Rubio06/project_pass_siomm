<div class="flex-1 flex justify-center items-start w-full mt-2 transition-all duration-300">
    <form class="w-full max-w-[1500px] mx-auto px-2 sm:px-4 md:px-6" [formGroup]="form">
        <div class="bg-white p-4 rounded-xl shadow-lg border border-gray-100 mb-6">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-gray-300 pb-4">
                <h3 class="text-base sm:text-lg font-bold flex items-center text-[#013B5C] ">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                        stroke="currentColor" class="w-5 h-5 sm:w-6 sm:h-6 text-[#013B5C]">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 3c2.757 0 5.23 1.107 7.071 2.949A10.437 10.437 0 0 1 21 12c0 2.757-1.107 5.23-2.949 7.071A10.437 10.437 0 0 1 12 21c-2.757 0-5.23-1.107-7.071-2.949A10.437 10.437 0 0 1 3 12c0-2.757 1.107-5.23 2.949-7.071A10.437 10.437 0 0 1 12 3Z" />
                    </svg>
                    <span>Filtros Registro Balanza</span>
                </h3>
                <!-- [ngClass]="botoColor()" -->
                <div
                    class="inline-flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl bg-gray-50 transition-all duration-200">
                    <span
                        class="flex items-center justify-center w-6 h-6 sm:w-7 sm:h-7 rounded-full text-white text-xs animate-pulse">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </span>
                    <span class="text-xs sm:text-sm font-bold line-clamp-1">
                        <!-- {{ botoPresionado() }} -->
                    </span>
                </div>
            </div>

            <div
                class="flex flex-col sm:flex-col lg:flex-col xl:flex-row sm:items-center sm:justify-between gap-4 mt-4 ">

                <div
                    class="w-full flex-1 flex gap-2 flex-col sm:flex-row lg:flex-row xl:flex-row  sm:items-center sm:justify-between p-2 rounded-lg">
                    <div class="flex flex-col gap-1 flex-1 w-full">
                        <app-label-filtro [filtroLabel]="'Seleccione el Año'" />
                        <select formControlName="cie_ano" (change)="onAnioCambio($event)"
                            class="select-base w-full cursor-pointer">
                            <option disabled value="">Selecciona un año</option>
                            @for (anio of listAnios(); track $index) {
                            <option [value]="anio">{{ anio }}</option>
                            }
                        </select>
                    </div>

                    <div class="flex flex-col gap-1 flex-1 w-full">
                        <app-label-filtro [filtroLabel]="'Seleccione el Mes'" />
                        <select formControlName="cie_per"  (change)="onMesCambio($event)"
                            class="select-base w-full cursor-pointer">
                            <option [value]="null" disabled>Seleccione un mes</option>
                            @for (mes of listMeses(); track $index) {
                            <option [value]="mes">{{ mes | transfornMonth }}</option>
                            }
                        </select>
                    </div>

                    <div class="flex flex-col gap-1 flex-1 w-full">
                        <app-label-filtro [filtroLabel]="'Seleccione una Fecha'" />
                        <select formControlName="cie_dia" class="select-base w-full cursor-pointer">
                            <!-- <app-filtro-mes [listaMeses]="listaMeses()"  -->
                            <!-- /> -->
                        </select>
                    </div>
                </div>

                <div class="border flex-1 w-full">
                    <button (click)="onNuevo()">Preionando el boton</button>
                </div>


            </div>


        </div>

        <div class="flex items-end justify-between mb-5">

            <div class="flex items-center gap-2">

                <div class="bg-[#013B5C] p-1.5 rounded-md">

                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 10h18M3 6h18M3 14h18M3 18h18" />

                    </svg>

                </div>

                <div>

                    <h1 class="text-sm font-bold text-[#013B5C]">
                        Detalle Balanza
                    </h1>

                    <p class="text-xs text-gray-400">
                        Listado de Detalle Balanza
                    </p>

                </div>

            </div>

            <div class="flex items-center gap-1.5 bg-[#013B5C]/10 border border-[#013B5C]/20 px-3 py-1.5 rounded-lg">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-[#013B5C]" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />

                </svg>

                <span class="text-xs font-bold text-[#013B5C]">
                    {{ listBalanzaDetalle().length }}
                </span>

                <b>
                    <span class="text-xs text-[#013B5C]/70">
                        registro
                    </span>
                </b>

            </div>

        </div>

        <div class="border border-gray-300 overflow-auto">
            <app-tabla-balanza-detalle 

                [codTicketBalanza]="codTicketBalanza()"
                [listBalanzaDetalle]="listBalanzaDetalle()" 
                [isLoading]="isLoading()" 
                (obBalanzaDetalle)="onSeleccionar($event)"
                />
        </div>

        <app-paginacion 
            [paginaActual]="paginaActual()" 
            [totalPaginas]="totalPaginas()"
            [totalRegistros]="totalRegistros()" 
            (paginaCambio)="paginaCambio($event)" 
        />

    </form>
</div>

@if(abrirlModalBlnzDet()) {
    <app-modal-detalle-ballanza 
        (onCerrar)="abrirlModalBlnzDet.set(false)" 
        [modo]="modo()" 
        [codTicketBalanza]="codTicketBalanza()"
    />
}
