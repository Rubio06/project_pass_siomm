<form class="container mx-auto p-5" [formGroup]="formFiltro">

    @if (!esAdministracionContratos()) {
    <div class="p-5 rounded-xl border border-gray-200 shadow-sm">

        <div
            class=" items-start justify-between flex flex-col md:flex-col lg:flex-col lg:items-center   xl:flex-row xl:items-center mb-6">
            <app-titulo-modulo [titulo]="'Filtro para Mantenimiento'" />
            <!-- <app-titulo-botones />  -->
            <!-- [botonActivo]="botonActivo()"   -->
            <div class="inline-flex items-center gap-3 rounded-xl bg-gray-50 transition-all duration-200 ">
                <span class="flex items-center justify-center w-7 h-7 rounded-full text-white text-xs animate-pulse"
                    [ngClass]="botoColor()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                </span>
                <span class="text-sm font-bold">{{ botoPresionado() }}</span>
            </div>
        </div>

        <div
            class=" w-full flex flex-col md:flex-col md:items-center  lg:flex-col lg:items-center   xl:flex-col xl:items-center xl:justify-between 2xl:flex-row gap-4">
            <div class="flex flex-col md:flex-row  gap-4">

                <div class="flex flex-wrap items-center gap-3">

                    <div class="w-70"> <select formControlName="cod_empresa" class="select-base w-full cursor-pointer">
                            @for (item of listEmpresa(); track $index) {
                            <option [value]="item.cod_empresa">{{item.nom_empresa}}</option>
                            }
                        </select>
                    </div>

                    @if (!esRutaContrata()) {
                    <div class="w-70">
                        <select formControlName="cod_empresa_unidad" class="select-base w-full cursor-pointer">
                            @for (item of listUnidadEmpresa(); track $index) {
                            <option [value]="item.cod_empresa_unidad">{{item.nom_empresa_unidad}}</option>
                            }
                        </select>
                    </div>
                    }

                </div>
            </div>

            <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">


                <!-- [bloqueo]="bloqueo()" -->


                <div class="flex flex-wrap items-center gap-4">
                    @for (btn of accionService.botones(); track $index) {
                    <app-botones [texto]="btn.texto" (accion)="onAccion(btn.accion)" [color]="btn.color"
                        [icono]="btn.icono" [bloqueo]="btn.bloqueo" />
                    }
                </div>
            </div>
        </div>
    </div>
    }



    <div>
        @if (!esAdministracionContratos()) {
        <div class="mt-3 mb-3">
            <app-titulo-modulo [titulo]="'Seleccione una Opción para Navegar entre Pestañas'" />
        </div>
        }
        <router-outlet></router-outlet>
    </div>
</form>
