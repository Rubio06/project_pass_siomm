<form [formGroup]="miFormulario" (ngSubmit)="onGuardar()" class="fixed inset-0 flex items-center justify-center bg-black/40 "
    style="z-index: 9999;">
    <div
        class="w-11/12 max-w-4xl bg-base-100 p-5 rounded-xl shadow-xl border border-base-300 overflow-y-auto max-h-[90vh]">

        <div class="flex justify-between w-full">
            <h3 class="text-lg font-bold text-[#013B5C] flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[#534AB7]" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <path d="M16 12H8"></path>
                </svg>
                Detalle - Precio Unitario
            </h3>
            <button type="button"
                class="btn btn-sm btn-circle btn-ghost text-base-content/70 hover:text-error transition-colors"
                (click)="onCerrarModalPreUnitarioDetalle.emit(false)">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="mt-5 flex flex-col sm:flex-row gap-5 text-[12px]">

            <div class=" flex-3 border border-base-300 rounded-xl p-4">
                <div class="w-full flex flex-col gap-3 text-[12px] p-1 ">

                    <div class="flex flex-col md:flex-row md:items-center w-full gap-2">

                        <label class="label py-0.5 w-full md:w-[15%] shrink-0">
                            <span class="label-text font-bold text-[#013B5C]">Nro. Partido</span>
                        </label>

                        <div class="flex flex-row sm:flex-row flex-1 gap-2 w-full">
                            <input type="text" class="input-base_3 flex-1  font-mono font-bold"
                                formControlName="nro_partida" />

                            <input type="text"
                                class="input-base_3 flex-5 min-w-[200px] read-only:opacity-60 read-only:bg-gray-100 read-only:cursor-not-allowed"
                                formControlName="c_t_actividad" />
                        </div>

                    </div>

                </div>
                <div class="w-full flex flex-col gap-3 text-[12px] p-1">

                    <div class="flex flex-col md:flex-row md:items-center w-full gap-2">

                        <label class="label py-0.5 w-full md:w-[15%] shrink-0">
                            <span class="label-text font-bold text-[#013B5C]">Descripción</span>
                        </label>

                        <div class="flex flex-row sm:flex-row flex-1 gap-2 w-full">
                            <input type="text"
                                class="input-base_3 flex-1 font-mono font-bold read-only:opacity-60 read-only:bg-gray-100 read-only:cursor-not-allowed"
                                formControlName="actividad_tarea_codigo" />
                            <input type="text" class="input-base_3 flex-5 min-w-[200px] " 
                                formControlName="des_catalogo_tarea" />
                        </div>

                    </div>

                </div>

                <div class="flex flex-col text-[12px] p-1 w-[50%]">

                    <div class="flex flex-col md:flex-row md:items-center w-full gap-3">

                        <label class="label py-0.5 w-full md:w-[50%] shrink-0">
                            <span class="label-text font-bold text-[#013B5C]">Total Costo Directo S/.</span>
                        </label>

                        <div class="flex flex-row sm:flex-row flex-1 gap-2 w-full">
                            <input type="text"
                                class="input-base_3 flex-1 font-mono font-bold read-only:opacity-60 read-only:bg-gray-100 read-only:cursor-not-allowed"
                                formControlName="imp_costo_directo" />
                        </div>

                    </div>

                </div>


                <div class="flex flex-col sm:flex-row md:flex-row text-[12px] p-1 w-full gap-4">

                    <div class="flex flex-col md:flex-row md:items-center gap-3 flex-3">

                        <label class="label py-0.5  w-[24%] items-start h-full">
                            <span class="label-text font-bold text-[#013B5C]">Observación</span>
                        </label>

                        <div class="flex flex-row sm:flex-row flex-1 gap-2 w-[76%]">
                            <textarea class="input-base_5 textarea-xs w-full resize-none h-20"
                                formControlName="des_observacion"></textarea>
                        </div>

                    </div>
                    <div class="flex-1">
                        <div class="flex items-center sm:w-full  w-full justify-between mb-2">
                            <label class="cursor-pointer select-none shrink-0 w-full flex items-center justify-between">
                                <span class="label-text font-bold text-[#013B5C]"> Orden de Trabajo </span>

                                <input type="checkbox" class="hidden peer" formControlName="ind_situacion" />
                                <span
                                    class="w-4 h-4 rounded border-2 border-[#002B48] flex items-center justify-center bg-white peer-checked:bg-[#002B48] peer-checked:shadow-[0_0_8px_rgba(0,43,72,0.7)] transition-all duration-300 ease-in-out">
                                    <svg class="w-3 h-3 text-white scale-0 peer-checked:scale-100 transition-transform duration-300 ease-in-out"
                                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke="currentColor" stroke-width="3">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                    </svg>
                                </span>
                            </label>
                        </div>
                        <div class="flex sm:w-full  items-center w-full justify-between">
                            <label class="cursor-pointer select-none shrink-0 flex items-center w-full justify-between">
                                <span class="label-text font-bold text-[#013B5C]"> Especificar Zona </span>

                                <input type="checkbox" class="hidden peer" formControlName="ind_zona" />
                                <span
                                    class="w-4 h-4 rounded border-2 border-[#002B48] flex items-center justify-center bg-white peer-checked:bg-[#002B48] peer-checked:shadow-[0_0_8px_rgba(0,43,72,0.7)] transition-all duration-300 ease-in-out">
                                    <svg class="w-3 h-3 text-white scale-0 peer-checked:scale-100 transition-transform duration-300 ease-in-out"
                                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                        stroke="currentColor" stroke-width="3">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                    </svg>
                                </span>
                            </label>
                        </div>
                    </div>
                </div>

            </div>
            <div class=" flex-1 border border-base-300 rounded-xl p-4">
                <div class="flex flex-col md:flex-row md:items-center w-full gap-3 mb-2">

                    <label class="label py-0.5 w-full md:w-[45%] shrink-0">
                        <span class="label-text font-bold text-[#013B5C]">Estado</span>
                    </label>

                    <div class="flex flex-row sm:flex-row flex-1 gap-2 w-full">
                        <select class="select-base_dos" formControlName="ind_estado">
                            <option value="A">Activa</option>
                            <option value="X">Inactiva</option>
                        </select>
                    </div>

                </div>
                <div class="flex flex-col md:flex-row md:items-center w-full gap-3 mb-2">

                    <label class="label py-0.5 w-full md:w-[45%] shrink-0">
                        <span class="label-text font-bold text-[#013B5C]">Unidad Medida</span>
                    </label>

                    <div class="flex flex-row sm:flex-row flex-1 gap-2 w-full">
                        <input type="text"
                            class="input-base_3 flex-1 font-mono font-bold read-only:opacity-60 read-only:bg-gray-100 read-only:cursor-not-allowed"
                            formControlName="c_t_unidad_medida" />
                    </div>

                </div>
                <div class="flex flex-col md:flex-row md:items-center w-full gap-3 mb-2">

                    <label class="label py-0.5 w-full md:w-[45%] shrink-0">
                        <span class="label-text font-bold text-[#013B5C]">Total Costo S/.</span>
                    </label>

                    <div class="flex flex-row sm:flex-row flex-1 gap-2 w-full">
                        <input type="text" class="input-base_3 flex-1 font-mono font-bold  read-only:opacity-60 read-only:bg-gray-100 read-only:cursor-not-allowed" 
                            formControlName="imp_costo_partida" />
                    </div>

                </div>
                <div class="flex flex-col md:flex-row md:items-center w-full gap-3 mb-2">

                    <label class="label py-0.5 w-full md:w-[45%] shrink-0">
                        <span class="label-text font-bold text-[#013B5C]">Total Costo U$$.</span>
                    </label>

                    <div class="flex flex-row sm:flex-row flex-1 gap-2 w-full">
                        <input type="text" class="input-base_3 flex-1 font-mono font-bold  read-only:opacity-60 read-only:bg-gray-100 read-only:cursor-not-allowed"
                            formControlName="imp_costo_partida_dolar" />
                    </div>

                </div>
                <div class="flex flex-col md:flex-row md:items-center w-full gap-3 mb-2">

                    @if (miFormulario.get('ind_zona')?.value) {
                        <select class="select-base_dos" formControlName="cod_zona">
                            @for (zn of listZonasPu(); track zn.cod_zona) {
                            <option [value]="zn.cod_zona">
                                {{zn.cod_zona}} - {{ zn.des_zona }}
                            </option>
                            }
                        </select>
                    }

                </div>
            </div>

        </div>

        <app-tab-precio-unitario [activeTab]="tabActivo()" (onTabChange)="onCambiarTab($event)" />

        @if(tabActivo() === 'costo-partida') {
             <app-costo-partida
                [imp_costo_directo]="miFormulario.get('imp_costo_directo')?.value"

                                [c_n_porcentaje]="miFormulario.get('c_n_porcentaje')?.value"
                                [c_n_monto]="miFormulario.get('c_n_monto')?.value"
                                [nro_trabajador]="miFormulario.get('nro_trabajador ')?.value"
                                [nro_hotras_labor]="miFormulario.get('nro_hotras_labor  ')?.value"

                [costoPartidaArray]="costoPartidaArray"
                (cargarPrecioUnitarioCabTab)="cargarPrecioUnitarioCabTab()"
                (onTotalPuSol)="onTotalPuSol($event)"
                (onTotalGeneral)="onTotalGeneral($event)"
            />
        }
        @if(tabActivo() === 'parametros-principales') {

            <app-parametros-principales 
                [parametroPrincipalArray]="parametroPrincipalArray"

            /> 
        }

        @if(tabActivo() === 'sub-parametros') {
            <app-sub-parametros 
                [subParametrosArray]="subParametrosArray" 
                (subtotalChange)="onSubtotalChange($event)"

            />

        }

        <div class="modal-action pt-3 mt-2 flex justify-end gap-2">
            <button type="button"
                class="btn btn-sm text-white bg-slate-600 hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1 rounded">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                </svg>
                Revertir
            </button>

            <button type="submit"
                class="btn btn-sm text-white bg-[#013B5C] hover:bg-[#002B48] flex items-center gap-1
                           disabled:opacity-50 disabled:bg-gray-500 disabled:text-gray-200 disabled:cursor-not-allowed disabled:hover:bg-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                Aceptar
            </button>

            <button type="button" class="btn btn-sm btn-outline border-base-300 flex items-center gap-1"
                (click)="onCerrarModalPreUnitarioDetalle.emit(false)">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
                Cancelar
            </button>
        </div>
    </div>

</form>
