<div class="space-y-4 bg-base-100">

    <div class="p-5 rounded-xl border border-gray-200 shadow-sm ">
        <!-- <div></div> -->
        <div class="flex justify-between border-b border-gray-200 pb-2 flex-col md:flex-row">
            <h3 class="text-lg font-bold flex items-center gap-2 text-[#013B5C]">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor" class="w-6 h-6 text-[#013B5C]">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3c2.757 0 5.23 1.107 7.071 2.949A10.437 10.437 0 0 1 21 12c0 2.757-1.107 5.23-2.949 7.071A10.437 10.437 0 0 1 12 21c-2.757 0-5.23-1.107-7.071-2.949A10.437 10.437 0 0 1 3 12c0-2.757 1.107-5.23 2.949-7.071A10.437 10.437 0 0 1 12 3Z" />
                </svg>
                Filtros para Administración de Contratos
            </h3>
            <div class="flex gap-4 justify-between ">
                <div class="inline-flex items-center gap-3 rounded-xl bg-gray-50 transition-all duration-200 ">
                    <span class="flex items-center justify-center w-7 h-7 rounded-full text-white text-xs animate-pulse"
                        [ngClass]="botoColor()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </span>
                    <span class="text-sm font-bold">{{ botoPresionado() }}</span>
                </div>
            </div>

        </div>


        <div class="flex flex-col lg:flex-col xl:flex-row w-full mx-auto gap-5">
            <app-filtros-contrato class="flex-3" (loadingChange)="isLoading.set($event)" />
            <div class="flex flex-wrap items-center gap-4 flex-2 xl:justify-end">
                @for (btn of accionService.botonesAdmContrato(); track $index) {
                <app-botones [texto]="btn.texto" [color]="btn.color" [icono]="btn.icono" [bloqueo]="btn.bloqueo"
                    (accion)="onAccion(btn.accion)" />


                }
            </div>

        </div>
    </div>


    <div class="overflow-hidden mt-2 w-[95%] mx-auto">

        <div class="flex items-end justify-between mb-5">

            <div class="flex items-center gap-2">

                <div class="bg-[#013B5C] p-1.5 rounded-md">

                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 10h18M3 6h18M3 14h18M3 18h18" />

                    </svg>

                </div>

                <div>

                    <h1 class="text-sm font-bold text-[#013B5C]">
                        Adm. Contrato
                    </h1>

                    <p class="text-xs text-gray-400">
                        Listado de Labores Adm. Contrato
                    </p>

                </div>

            </div>

            <div class="flex items-center gap-1.5 bg-[#013B5C]/10 border border-[#013B5C]/20 px-3 py-1.5 rounded-lg">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-[#013B5C]" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />

                </svg>

                <span class="text-xs font-bold text-[#013B5C]">
                    {{ listContrato().length }}
                </span>

                <b>
                    <span class="text-xs text-[#013B5C]/70">
                        registro
                    </span>
                </b>

            </div>

        </div>
        <div class="border border-gray-300 rounded overflow-hidden">
            <!-- AREA TABLA -->
            <div class="flex-1 overflow-auto">

                <app-tabla-contrato [listContrato]="listContrato()" [isLoading]="isLoading()" (abrirContrato)="onAbrirContrato($event)" class="block min-w-max" />


                <!-- FOOTER -->
            </div>

        </div>
    </div>
</div>
@if(abrirModal()) {
    <app-servicio-transporte (cerrarModal)="abrirModal.set(false)" [obServicioTransporte]="obServicioTransporte()" 
    [modo]="modo()"
    /> 
}
