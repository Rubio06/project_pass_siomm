<form [formGroup]="form" class="max-w-7xl mx-auto pb-10">

    <app-nav-bar (onTabChange)="$event === 'lista' ? intentarSalirADetalle() : tabActivo.set('detalle')" [tabActivo]="tabActivo()"
                [detalleTexto]="'Lista de Und. Econom.'"
        [listaTexto]="'Detalle de Und. Econom.'"
    />

    @if (tabActivo() === 'lista') {

        <div class="flex flex-col md:flex-row xl:flex-row lg:flex-row items-center gap-8 mb-4">


            <div class="flex gap-2 items-center mt-3 mb-3">
                <div>
                    <button type="button" (click)="onLimpiarFormulario()"
                        class="p-2 bg-gray-200 hover:bg-gray-300 cursor-pointer rounded transition duration-200 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-6 text-gray-700" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12M9 7V4h6v3m-8 0l1 12h6l1-12" />
                        </svg>
                    </button>
                </div>

                <!-- (keyup.enter)="keBuscar()" -->
                <div>
                    <input class="w-52 input-base_2 placeholder:text-gray-400" type="text" formControlName="texto_busqueda"  (keyup.enter)="keBuscar()"
                        placeholder="Codigo o Nombre"  />
                </div>
            </div>
        </div>

        <div class="flex items-end justify-between mb-5">
            <div class="flex items-center gap-2">
                <div class="bg-[#013B5C] p-1.5 rounded-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 10h18M3 6h18M3 14h18M3 18h18" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-[#013B5C]">Unidad Ecónomica</h1>
                    <p class="text-xs text-gray-400">Listado de Unidades Económicas registradas</p>
                </div>
            </div>

            <div class="flex items-center gap-1.5 bg-[#013B5C]/10 border border-[#013B5C]/20 px-3 py-1.5 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-[#013B5C]" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <span class="text-xs font-bold text-[#013B5C]">{{ listUnidadEconomica().length }}</span>
                <b><span class="text-xs text-[#013B5C]/70">registro{{ listUnidadEconomica().length !== 1 ? 's' : '' }}</span></b>
            </div>
        </div>

        <app-lista-und-economica
            [listUnidadEconomica]="listUnidadEconomica()"
            [isLoading]="isLoading()"
            [idUndEconomicaSeleccionada]="idNivelSeleccionada()"
            (onUndEconomicaSeleccionada)="onUndEconomicaSeleccionada($event)"
            (onEliminarUndEconomica)="onEliminar($event)" />
    }

    @if (tabActivo() === 'detalle') {
        <app-detalle-und-economica [listUndEconomicaRecibida]="listUndEconomicaRecibida()" [listUnidadEconomica]="listUnidadEconomica()" [_listZonasMant]="_listZonasMant()"
            [listZona]="listZona()" [listNivel]="listZona()" [listZona]="listZona()"
            [listProcBalanza]="listProcBalanza()" [listGrupoControl]="listGrupoControl()" (onGuardarUndEconomica)="onGuardar($event)"
            [codigoSiguiente]="codigoSiguiente()"
            [listUsuario]="listUsuario()"
            #detalleUndEconom
            />
    }

</form>
