<div
    class="flex flex-col w-[65%] md:flex-row lg:flex-row xl:flex-row space-x-2 pb-1 mt-2 mb-2 border-b border-base-300">

    <a (click)="cambiarTab('lista')" [class.tab-active]="tabActivo() === 'lista'"
        class="tab-style flex items-center gap-1 whitespace-nowrap px-1 py-1 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 5.25h16.5m-16.5-10.5h16.5" />
        </svg>
        <span class="text-[11px] font-medium">{{ detalleTexto() }}</span>
    </a>

    <a (click)="cambiarTab('detalle')"
        [class.tab-active]="tabActivo() === 'detalle'" 
        [class.opacity-40]="tabActivo() === 'lista'"
        [class.pointer-events-none]="tabActivo() === 'lista'" 
        [class.cursor-not-allowed]="tabActivo() === 'lista'"
        class="tab-style flex items-center gap-1 whitespace-nowrap px-1 py-1 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
        <span class="text-[11px] font-medium">{{ listaTexto() }}</span>
    </a>
</div>
